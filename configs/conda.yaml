name: emotion-mlops

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.4.0+cu118
    - torchvision==0.19.0+cu118
    - transformers==4.44.0
    - numpy<2
    - accelerate>=0.33.0
    - pandas>=2.0.0
    - scikit-learn>=1.4.0
    - azure-ai-ml>=1.13.0
    - azure-identity>=1.15.0
    - azureml-core>=1.49.0
    - fastapi
    - uvicorn
    - streamlit
    - typer
    - pydantic
    - pyyaml
    - sentencepiece
    - sacremoses
    - datasets
    - evaluate
    - openai-whisper
    - mlflow>=2.12.0
    - azureml-inference-server-http