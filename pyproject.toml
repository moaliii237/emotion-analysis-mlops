[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "emotion-mlops"
version = "0.1.0"
description = "Dutch TV transcript emotion classification pipeline"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "mlflow>=2.12.0",
    "sentencepiece>=0.2.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
emotionscope = "emotion_mlops.cli.main:main"
emotion-pipeline = "emotion_mlops.cli.infer:main"

[tool.setuptools.packages.find]
where = ["src"]