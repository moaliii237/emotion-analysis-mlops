# EmotionScope Monitoring Stack
# Separate from the main backend/frontend stack, pure observability layer
# Local: docker compose -f docker-compose.monitoring.yml up -d

services:

  # ===== Prometheus (metrics collector) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: emotionscope-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    # Allow Prometheus to reach the host (where FastAPI runs)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===== Grafana (visualization) =====
  grafana:
    image: grafana/grafana:latest
    container_name: emotionscope-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    restart: unless-stopped
    depends_on:
      - prometheus


# ===== Persistent volumes =====
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local